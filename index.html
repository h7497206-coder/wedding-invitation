
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#f7f0e5">

  <meta
    name="description"
    content="A special wedding invitation for Abu-Bakr and Malaika."
  >

  <title>Abu-Bakr &amp; Malaika — Wedding Invitation</title>

  <!-- Main website styling -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="welcome-page">

    <!-- Soft background glow -->
    <div class="ambient-glow" aria-hidden="true"></div>

    <!-- Page heading -->
    <header class="intro">

      <p class="intro__eyebrow">
        A Love Letter From
      </p>

      <!-- Names are separated for accurate spacing -->
      <h1 class="intro__names" id="page-title">

        <span class="intro__name intro__name--first">
          Abu-Bakr
        </span>

        <span class="intro__ampersand">
          &amp;
        </span>

        <span class="intro__name intro__name--second">
          Malaika
        </span>

      </h1>

      <!-- Couple monogram divider -->
      <div class="intro__ornament" aria-hidden="true">

        <span class="intro__line"></span>

        <span class="intro__monogram">
          <span>A</span>
          <span class="intro__heart">♥</span>
          <span>M</span>
        </span>

        <span class="intro__line"></span>

      </div>

      <!-- English subtitle -->
      <p class="intro__subtitle">
        A beautiful beginning, a lifetime of love
      </p>

      <!-- Urdu subtitle -->
      <p
        class="intro__urdu"
        lang="ur"
        dir="rtl"
      >
        محبت کے ایک خوبصورت سفر کی شروعات
      </p>

    </header>

    <!-- Main invitation card -->
    <section
      class="invitation-section"
      aria-label="Wedding invitation"
    >

      <button
        class="invitation-card"
        id="invitation-card"
        type="button"
        aria-label="Open Abu-Bakr and Malaika's wedding invitation"
        aria-describedby="invitation-hint"
      >

        <img
          class="invitation-card__image"
          src="assets/images/wedding-envelope.webp"
          alt="Burgundy wedding envelope decorated with gold details,
               floral arrangements and a central wax seal"
          draggable="false"
        >

      </button>

      <p
        class="invitation-hint"
        id="invitation-hint"
      >
        A special invitation awaits you
      </p>

      <span
        class="invitation-section__scroll"
        aria-hidden="true"
      >
        ✦
      </span>

    </section>

    <!-- Footer -->
    <footer class="welcome-footer">

      <span class="welcome-footer__line"></span>

      <p>Made with love &amp; duas</p>

      <span class="welcome-footer__line"></span>

    </footer>

  </main>

  <!-- JavaScript functionality -->
  <script src="js/script.js" defer></script>
</body>
</html>
